spring:
  application:
    name: inwza-inventory-service
  profiles:
    active: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inwza-inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${SERVER_PORT:8084}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:50054}
  client:
    item:
      address: ${GRPC_ITEM_ADDRESS:static://localhost:50052}
      negotiationType: plaintext

inwza:
  jwt:
    access-secret-key: ${JWT_ACCESS_SECRET_KEY:01234567890123456789012345678901}
    api-secret-key: ${JWT_API_SECRET_KEY:01234567890123456789012345678903}
  kafka:
    inventory-topic: inventory
    payment-topic: payment
  paginate:
    inventory-next-page-base-url: ${PAGINATE_INVENTORY_NEXT_PAGE_BASED_URL:http://localhost:8084/inventory_v1/inventory}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] --- %msg%n"
